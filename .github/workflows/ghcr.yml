name: Build and push Docker images

on:
  push:
    branches: ["develop", "master"]
    tags: ["v*"]
    paths:
      - 'apps/server/**'
      - '.github/workflows/ghcr.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Additional image tag (for example enable-banking)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: paradoxon-tools

jobs:
  test-server:
    runs-on: ubuntu-latest
    services:
      banking-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: banking_test
          POSTGRES_USER: banking_test
          POSTGRES_PASSWORD: banking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking_test -d banking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BANKING_TEST_R2DBC_URL: r2dbc:postgresql://localhost:5432/banking_test
      BANKING_TEST_DB_USER: banking_test
      BANKING_TEST_DB_PASSWORD: banking_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: apps/server
        run: chmod +x gradlew

      - name: Run server tests
        working-directory: apps/server
        run: ./gradlew test --no-daemon -Dtest.profile=integration

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-server]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: server
            image: plannr-server
            context: ./apps/server
            file: ./apps/server/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate optional image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$IMAGE_TAG" && ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
