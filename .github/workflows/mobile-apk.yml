name: Build mobile APK

on:
  push:
    branches: ["master"]
    tags: ["mobile-v*"]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make mobile Gradle wrapper executable
        working-directory: apps/mobile
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: apps/mobile
        run: ./gradlew :client:androidApp:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp apps/mobile/client/androidApp/build/outputs/apk/release/*.apk dist/plannr-mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plannr-mobile-apk
          path: dist/plannr-mobile.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/plannr-mobile.apk
