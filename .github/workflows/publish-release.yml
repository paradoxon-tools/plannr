name: Publish versioned release

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to publish, in v<major>.<minor> format.
        required: true
        type: string
      ref:
        description: Immutable commit SHA to build and release.
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  validate-version:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.[0-9]+$ ]]; then
            echo "Expected a version tag in v<major>.<minor> format; received: $TAG"
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    needs: validate-version

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/plannr-server:${{ inputs.tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Lint mobile app
        working-directory: apps/mobile
        run: npm run lint

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/plannr-mobile-${TAG}.apk"

      - name: Create GitHub release and attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.ref }}
          generate_release_notes: true
          body: |
            ## Artifacts

            - [Mobile APK](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/plannr-mobile-${{ inputs.tag }}.apk)
            - [Server image](https://github.com/orgs/${{ github.repository_owner }}/packages/container/package/plannr-server): `ghcr.io/${{ github.repository_owner }}/plannr-server:${{ inputs.tag }}`
          files: dist/plannr-mobile-${{ inputs.tag }}.apk
