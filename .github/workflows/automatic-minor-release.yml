name: Publish automatic minor release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: master-release-versioning
  cancel-in-progress: false

jobs:
  create-minor-tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Check out the release merge commit with all release tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the release was merged with a merge commit
        env:
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 "$RELEASE_COMMIT")

          if [ -z "$second_parent" ] || [ -n "$extra" ]; then
            echo "Release pull requests must use 'Create a merge commit'."
            echo "Expected exactly two parents for $RELEASE_COMMIT."
            exit 1
          fi

          if [ "$second_parent" != "$RELEASE_HEAD" ]; then
            echo "The release merge commit does not contain the reviewed develop tip as its second parent."
            echo "Expected: $RELEASE_HEAD"
            echo "Received: $second_parent"
            exit 1
          fi

      - name: Determine and create the next minor tag
        id: version
        env:
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          latest_tag=$(git tag -l 'v*.*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.[0-9]+$' | head -n 1 || true)
          if [ -z "$latest_tag" ]; then
            next_tag="v0.1"
          else
            major=${latest_tag#v}
            major=${major%%.*}
            minor=${latest_tag##*.}
            next_tag="v${major}.$((minor + 1))"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$next_tag" "$RELEASE_COMMIT"
          git push origin "refs/tags/$next_tag"

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "ref=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: create-minor-tag
    if: needs.create-minor-tag.outputs.publish == 'true'
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.create-minor-tag.outputs.tag }}
      ref: ${{ needs.create-minor-tag.outputs.ref }}
    permissions:
      contents: write
      packages: write
